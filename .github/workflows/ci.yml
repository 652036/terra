name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Verify contracts and tests
        run: npm run verify
      - name: Build static artifact
        run: npm run build
      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: terra-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
